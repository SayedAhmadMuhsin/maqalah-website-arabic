<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নতুন রচনা লিখুন — মাকালাহ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">مقالة | মাকালাহ</a>
    <nav class="nav-links" id="auth-slot"></nav>
  </div>
</header>

<main class="container">
  <h1 class="page-title">নতুন রচনা প্রকাশ করুন</h1>
  <div class="form-box" style="max-width:700px;">
    <form id="essay-form">
      <div class="field">
        <label>শিরোনাম (আরবি বা বাংলা)</label>
        <input type="text" id="title" required placeholder="আপনার রচনার শিরোনাম">
      </div>
      <div class="field">
        <label>রচনার মূল লেখা (আরবি)</label>
        <textarea id="content" class="essay-editor" required placeholder="هنا اكتب مقالتك بالعربية..."></textarea>
      </div>
      <button type="submit" class="btn" id="submit-btn">প্রকাশ করুন</button>
      <p class="form-msg" id="msg"></p>
    </form>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/write.js"></script>
</body>
</html>
